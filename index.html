<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoldX - Live Gold Trading & Investment</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
    
    body {
      background: #0b0f19;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .app-container {
      background: #161e2e;
      border: 1px solid #243044;
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.7);
    }

    /* Header & Clock */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #243044;
      padding-bottom: 12px;
      margin-bottom: 15px;
    }

    .brand { font-size: 20px; font-weight: bold; color: #f59e0b; display: flex; align-items: center; gap: 8px; }

    .clock-box {
      text-align: right;
      font-size: 11px;
      color: #94a3b8;
    }

    .clock-box #liveTime { font-size: 13px; font-weight: bold; color: #38bdf8; }

    /* Live Rate Card */
    .rate-card {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 15px;
      text-align: center;
      margin-bottom: 15px;
      position: relative;
    }

    .rate-title { font-size: 12px; color: #94a3b8; text-transform: uppercase; }
    .rate-price { font-size: 28px; font-weight: bold; color: #facc15; margin: 5px 0; }
    
    .rate-change {
      font-size: 12px;
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    .up { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .down { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    /* Portfolio Stats */
    .portfolio-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .stat-box {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
    }

    .stat-box label { font-size: 11px; color: #64748b; }
    .stat-box div { font-size: 15px; font-weight: bold; color: #fff; margin-top: 3px; }

    /* Action Tabs */
    .tabs {
      display: flex;
      background: #0f172a;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 15px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .tab-btn.active { background: #2563eb; color: #fff; }

    /* Forms */
    .form-group { margin-bottom: 12px; }
    label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 5px; }

    input {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    input:focus { border-color: #f59e0b; }

    .btn-action {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      margin-top: 5px;
    }

    .btn-buy { background: #16a34a; color: #fff; }
    .btn-buy:hover { background: #15803d; }
    
    .btn-sell { background: #dc2626; color: #fff; }
    .btn-sell:hover { background: #b91c1c; }

    .btn-invest { background: #d97706; color: #fff; }
    .btn-invest:hover { background: #b45309; }

    /* Transaction History */
    .history-box {
      margin-top: 15px;
      border-top: 1px solid #243044;
      padding-top: 12px;
    }

    .history-title { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
    
    .history-list {
      max-height: 120px;
      overflow-y: auto;
      font-size: 11px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #1e293b;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="app-container">

  <!-- Header & Live Clock -->
  <div class="header">
    <div class="brand"><i class="fa-solid fa-coins"></i> GoldX Trade</div>
    <div class="clock-box">
      <div id="liveDate">--/--/----</div>
      <div id="liveTime">00:00:00 AM</div>
    </div>
  </div>

  <!-- Live Rate Display -->
  <div class="rate-card">
    <div class="rate-title">24K 99.9% शुद्ध सोने का भाव (प्रति ग्राम)</div>
    <div class="rate-price" id="goldRate">₹ 7,250.00</div>
    <span class="rate-change up" id="rateStatus"><i class="fa-solid fa-arrow-trend-up"></i> +0.00%</span>
  </div>

  <!-- Balance & Holdings -->
  <div class="portfolio-grid">
    <div class="stat-box">
      <label>वॉलेट बैलेंस</label>
      <div id="walletBal">₹ 50,000.00</div>
    </div>
    <div class="stat-box">
      <label>गोल्ड होल्डिंग</label>
      <div id="goldHoldings">0.0000 ग्राम</div>
    </div>
  </div>

  <!-- Action Navigation -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('buy')">Buy (खरीदें)</button>
    <button class="tab-btn" onclick="switchTab('sell')">Sell (बेचें)</button>
    <button class="tab-btn" onclick="switchTab('invest')">SIP / Invest</button>
  </div>

  <!-- 1. BUY FORM -->
  <div id="buySection">
    <div class="form-group">
      <label>रुपये दर्ज करें (₹)</label>
      <input type="number" id="buyAmount" placeholder="उदा. 1000" oninput="calcBuyGrams()">
    </div>
    <div class="form-group">
      <label>प्राप्त होने वाला सोना (Grams)</label>
      <input type="text" id="buyGrams" readonly placeholder="0.0000 ग्राम">
    </div>
    <button class="btn-action btn-buy" onclick="executeBuy()">गोल्ड खरीदें (Buy Gold)</button>
  </div>

  <!-- 2. SELL FORM -->
  <div id="sellSection" class="hidden">
    <div class="form-group">
      <label>ग्राम दर्ज करें (Grams)</label>
      <input type="number" id="sellGrams" step="0.0001" placeholder="उदा. 0.5" oninput="calcSellAmount()">
    </div>
    <div class="form-group">
      <label>मिलने वाली राशि (₹)</label>
      <input type="text" id="sellAmount" readonly placeholder="₹ 0.00">
    </div>
    <button class="btn-action btn-sell" onclick="executeSell()">गोल्ड बेचें (Sell Gold)</button>
  </div>

  <!-- 3. INVEST/SIP FORM -->
  <div id="investSection" class="hidden">
    <div class="form-group">
      <label>दैनिक निवेश राशि (Daily SIP Amount ₹)</label>
      <input type="number" id="investAmount" placeholder="उदा. 500">
    </div>
    <div class="form-group">
      <label>अवधि (Duration)</label>
      <input type="text" value="30 दिन Auto-SIP Plan" readonly>
    </div>
    <button class="btn-action btn-invest" onclick="executeInvest()">SIP निवेश शुरू करें</button>
  </div>

  <!-- Transaction History -->
  <div class="history-box">
    <div class="history-title">हाल के ट्रांजैक्शन</div>
    <div class="history-list" id="txHistory">
      <div style="text-align:center; color:#64748b; padding:10px;">कोई लेनदेन नहीं मिला।</div>
    </div>
  </div>

</div>

<script>
  // Initial User Portfolio Data
  let walletBalance = 50000.00;
  let goldGrams = 0.0000;
  let currentGoldRate = 7250.00; // Base Rate per Gram

  // Live Timer & Date Function
  function updateClock() {
    const now = new Date();
    const dateStr = now.toLocaleDateString('hi-IN', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });

    document.getElementById('liveDate').innerText = dateStr;
    document.getElementById('liveTime').innerText = timeStr;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Hourly Rate Fluctuation Engine
  function updateGoldRate() {
    const changePercent = (Math.random() * 2 - 1).toFixed(2); // Random -1% to +1%
    const changeValue = (currentGoldRate * changePercent) / 100;
    currentGoldRate = parseFloat((currentGoldRate + changeValue).toFixed(2));

    const rateEl = document.getElementById('goldRate');
    const statusEl = document.getElementById('rateStatus');

    rateEl.innerText = `₹ ${currentGoldRate.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;

    if (changePercent >= 0) {
      statusEl.className = "rate-change up";
      statusEl.innerHTML = `<i class="fa-solid fa-arrow-trend-up"></i> +${changePercent}%`;
    } else {
      statusEl.className = "rate-change down";
      statusEl.innerHTML = `<i class="fa-solid fa-arrow-trend-down"></i> ${changePercent}%`;
    }
  }

  // 1 घंटे (3600000 ms) में रेट अपडेट का टाइमर
  setInterval(updateGoldRate, 3600000);
  // डेमो/टेस्टिंग के लिए हर 10 सेकंड में रेट अपडेट:
  setInterval(updateGoldRate, 10000);

  // Tab Switcher
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('buySection').classList.add('hidden');
    document.getElementById('sellSection').classList.add('hidden');
    document.getElementById('investSection').classList.add('hidden');

    if (tab === 'buy') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('buySection').classList.remove('hidden');
    } else if (tab === 'sell') {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('sellSection').classList.remove('hidden');
    } else {
      document.querySelectorAll('.tab-btn')[2].classList.add('active');
      document.getElementById('investSection').classList.remove('hidden');
    }
  }

  // Calculation Logic
  function calcBuyGrams() {
    const inr = parseFloat(document.getElementById('buyAmount').value) || 0;
    const grams = inr / currentGoldRate;
    document.getElementById('buyGrams').value = `${grams.toFixed(4)} ग्राम`;
  }

  function calcSellAmount() {
    const grams = parseFloat(document.getElementById('sellGrams').value) || 0;
    const inr = grams * currentGoldRate;
    document.getElementById('sellAmount').value = `₹ ${inr.toFixed(2)}`;
  }

  // Buy Execution
  function executeBuy() {
    const inr = parseFloat(document.getElementById('buyAmount').value);
    if (!inr || inr <= 0) return alert('कृपया वैध राशि दर्ज करें।');
    if (inr > walletBalance) return alert('पर्याप्त वॉलेट बैलेंस नहीं है!');

    const boughtGrams = inr / currentGoldRate;
    walletBalance -= inr;
    goldGrams += boughtGrams;

    updateUI();
    addHistory('BUY', `₹${inr}`, `+${boughtGrams.toFixed(4)}g`);
    document.getElementById('buyAmount').value = '';
    document.getElementById('buyGrams').value = '';
    alert('सफलतापूर्वक गोल्ड खरीदा गया!');
  }

  // Sell Execution
  function executeSell() {
    const grams = parseFloat(document.getElementById('sellGrams').value);
    if (!grams || grams <= 0) return alert('कृपया वैध ग्राम दर्ज करें।');
    if (grams > goldGrams) return alert('आपके पास पर्याप्त गोल्ड बैलेंस नहीं है!');

    const earnedInr = grams * currentGoldRate;
    goldGrams -= grams;
    walletBalance += earnedInr;

    updateUI();
    addHistory('SELL', `-${grams.toFixed(4)}g`, `+₹${earnedInr.toFixed(2)}`);
    document.getElementById('sellGrams').value = '';
    document.getElementById('sellAmount').value = '';
    alert('सफलतापूर्वक गोल्ड बेचा गया!');
  }

  // Invest Execution
  function executeInvest() {
    const sipAmt = parseFloat(document.getElementById('investAmount').value);
    if (!sipAmt || sipAmt <= 0) return alert('वैध SIP राशि दर्ज करें।');
    if (sipAmt > walletBalance) return alert('पर्याप्त बैलेंस नहीं है!');

    walletBalance -= sipAmt;
    const boughtGrams = sipAmt / currentGoldRate;
    goldGrams += boughtGrams;

    updateUI();
    addHistory('SIP', `₹${sipAmt}`, `Auto-SIP Started`);
    document.getElementById('investAmount').value = '';
    alert('आपका Gold SIP प्लान सफलतापूर्वक चालू कर दिया गया है!');
  }

  // Update Display Stats
  function updateUI() {
    document.getElementById('walletBal').innerText = `₹ ${walletBalance.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
    document.getElementById('goldHoldings').innerText = `${goldGrams.toFixed(4)} ग्राम`;
  }

  // Transaction History Logger
  function addHistory(type, detail1, detail2) {
    const list = document.getElementById('txHistory');
    if (list.innerHTML.includes('कोई लेनदेन नहीं')) list.innerHTML = '';

    const time = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `
      <span><b>${type}</b> (${time})</span>
      <span>${detail1}</span>
      <span style="color: ${type === 'BUY' || type === 'SIP' ? '#4ade80' : '#f87171'}">${detail2}</span>
    `;
    list.prepend(item);
  }
</script>

</body>
  </html>
